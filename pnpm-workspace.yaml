packages:
  - apps/*
  - packages/*
  - prisma

# Versões exatas, definidas uma vez e usadas pelos pacotes com "catalog:".
catalog:
  '@azure/msal-browser': 5.29.0
  '@azure/msal-react': 5.8.1
  '@emotion/react': 11.14.0
  '@emotion/styled': 11.14.1
  '@eslint/js': 10.0.1
  '@fontsource/montserrat': 5.3.0
  '@mui/icons-material': 9.5.0
  '@mui/material': 9.5.0
  '@nestjs/cli': 12.0.12
  '@nestjs/common': 12.4.2
  '@nestjs/core': 12.4.2
  '@nestjs/platform-express': 12.4.2
  '@nestjs/swagger': 12.1.1
  '@nestjs/testing': 12.4.2
  '@nestjs/throttler': 6.7.1
  '@prisma/adapter-pg': 7.10.1
  '@prisma/client': 7.10.1
  '@swc/core': 1.16.22
  '@tanstack/react-query': 5.107.1
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.10
  '@types/express': 5.0.6
  '@types/luxon': 3.7.6
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  '@types/react': 18.3.31
  '@types/react-dom': 18.3.7
  '@types/supertest': 7.2.1
  '@vitejs/plugin-react': 6.3.0
  '@vitest/coverage-v8': 5.1.0
  decimal.js: 10.6.0
  dotenv: 18.0.10
  eslint: 10.14.0
  eslint-plugin-react-hooks: 7.1.1
  helmet: 8.3.0
  jose: 6.2.17
  jsdom: 31.0.0
  luxon: 3.7.2
  nestjs-pino: 5.3.1
  pg: 8.23.1
  pino: 10.4.0
  pino-http: 11.0.0
  prettier: 3.10.0
  prisma: 7.10.1
  react: 18.3.1
  react-dom: 18.3.1
  react-router: 7.18.5
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  supertest: 7.3.2
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.72.2
  unplugin-swc: 2.0.0
  vite: 8.3.8
  vitest: 5.1.0
  zod: 4.6.7

# Scripts de instalação permitidos (pnpm 10 bloqueia por padrão): só ferramentas de build.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

# Telemetria do swagger-ui: não roda.
ignoredBuiltDependencies:
  - '@scarf/scarf'

# MUI 9 depende de react-is 19, que não reconhece elementos do React 18. A documentação do MUI
# pede react-is na mesma versão do React (ADR-014).
overrides:
  react-is: 18.3.1

# Scripts com a mesma sintaxe de shell no Windows e no Linux (ex.: `NODE_ENV=production vite build`).
shellEmulator: true
